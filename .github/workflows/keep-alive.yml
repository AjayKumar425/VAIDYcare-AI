name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 10 minutes (prevents Render 15-minute inactivity spin-down)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          curl -s -f --max-time 90 https://vaidycare-ai.onrender.com/health || echo "Waking up..."
